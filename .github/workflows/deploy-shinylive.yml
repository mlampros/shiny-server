# Builds the four Shiny applications as Shinylive (serverless, WebAssembly) apps
# and deploys them to GitHub Pages: https://mlampros.github.io/shiny-server/
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"

name: Deploy Shinylive apps to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shinylive
            any::renv
            any::shiny
            any::leaflet
            any::stringdist
            any::Rcpp
            any::RcppArmadillo
            any::R6

      # geojsonR is installed from r-universe, so that shinylive::export() bundles
      # the WebAssembly binary that r-universe builds for it
      - name: Install geojsonR from r-universe
        shell: Rscript {0}
        run: |
          install.packages("geojsonR", repos = "https://mlampros.r-universe.dev")
          stopifnot(requireNamespace("geojsonR", quietly = TRUE))

      - name: Export the Shinylive apps
        shell: Rscript {0}
        run: |
          apps <- c("geocoding_nominatim", "geocoding_nominatim_reverse",
                    "geocoding_geojson", "string_matching")
          for (app in apps) {
            shinylive::export(appdir = app, destdir = "_site", subdir = app)
          }
          file.copy("pages/index.html", "_site/index.html", overwrite = TRUE)
          file.create("_site/.nojekyll")

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
